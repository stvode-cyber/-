// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // 中国大陆网络：maven.google.com 不可达，改用阿里云 google 镜像
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // 中国大陆网络：maven.google.com 不可达，改用阿里云 google 镜像
        maven { url 'https://maven.aliyun.com/repository/google' }
        mavenCentral()
    }
    // 强制所有子模块用 JDK 17 编译（含 capacitor 插件的 kotlin toolchain）
    // 必须在子模块自己的 android { compileOptions } 和 kotlin { jvmToolchain } 之后执行
    // 所以用 gradle.taskGraph.whenReady 或 subprojects afterEvaluate
    subprojects { subp ->
        subp.afterEvaluate {
            if (subp.plugins.hasPlugin('com.android.library') || subp.plugins.hasPlugin('com.android.application')) {
                try {
                    subp.android {
                        compileOptions {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        }
                    }
                } catch(e) {}
            }
            if (subp.plugins.hasPlugin('org.jetbrains.kotlin.android') || subp.plugins.hasPlugin('kotlin-android')) {
                try {
                    subp.kotlin {
                        jvmToolchain(17)
                    }
                } catch(e) {}
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
