# P1-8 修复：注入安全响应头 + HTTPS 就绪配置
# 注意：本配置监听 80 端口并提供 HTTP→HTTPS 重定向的注释模板；
#       生产部署应配合 certbot/Let's Encrypt 启用 HTTPS（取消下方 443 server 注释）

# 安全响应头块（供 HTTP/HTTPS server 共用）
# 使用方式：在 server 块内 include 此片段 或直接复制下方 add_header 行

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /var/www/aie-frontend;
    index index.html;

    # P1-8 修复：安全响应头（HTTPS 部署后启用 STS）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 仅 HTTPS 启用：add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

