# livekit HTTPS server block — generated after certbot
# Overwrites the HTTP-only livekit.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name livekit.lujax.fun;
    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livekit.lujax.fun;

    # SSL — will be filled by certbot install
    ssl_certificate /etc/letsencrypt/live/livekit.lujax.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.lujax.fun/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/livekit.lujax.fun/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # lk-jwt-service: /sfu/get* /healthz* /get_token* → 8081
    location ~ ^/(sfu/get|healthz|get_token) {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
    }

    # LiveKit WebRTC: 其余全走 7880
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_buffering off;
    }
}
